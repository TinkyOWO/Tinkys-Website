<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tinky - Indie Game Developer</title>
  <style>
    :root {
      --accent: #ff4d6d;
      --accent-light: #ff6b8a;
      --accent-dark: #ff2a5f;
      --bg-tint: #0d0d0d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(to bottom, var(--bg-tint), #000000);
      color: #f0f0f0;
      line-height: 1.6;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
      transition: background 0.8s ease;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
      padding-top: 1.5rem;
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, var(--accent-light), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: all 0.6s ease;
    }

    .tagline {
      font-size: 1.25rem;
      color: #b0b0b0;
      margin-bottom: 1.4rem;
    }

    .intro {
      max-width: 520px;
      margin: 0 auto 2rem;
      color: #cfcfcf;
      font-size: 1.05rem;
    }

    .steam-link {
      display: inline-block;
      background: linear-gradient(90deg, var(--accent), var(--accent-dark));
      color: white;
      text-decoration: none;
      padding: 0.7rem 1.6rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .steam-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 40%, transparent);
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1.8rem;
      color: var(--accent-light);
      text-align: center;
      transition: color 0.6s ease;
    }

    .games {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      align-items: center;
      margin-bottom: 4.5rem;
    }

    .game-widget {
      width: 100%;
      max-width: 646px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .game-widget iframe {
      width: 100%;
      height: 190px;
      border: none;
      display: block;
    }

    .socials-section {
      text-align: center;
      margin-bottom: 3rem;
    }

    .socials {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.9rem;
    }

    .socials a {
      color: var(--accent-light);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.5rem 1.1rem;
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      border-radius: 30px;
      transition: all 0.3s ease;
    }

    .socials a:hover {
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      border-color: var(--accent);
      color: var(--accent-light);
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      padding-bottom: 2rem;
      color: #777;
      font-size: 0.9rem;
    }

    footer a {
      color: var(--accent-light);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    /* Floating cat */
    #floating-cat {
      position: fixed;
      width: 90px;
      height: auto;
      z-index: 9999;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    #floating-cat.bounce {
      animation: bounce 0.5s ease;
    }

    @keyframes bounce {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.35) rotate(-8deg); }
      50%  { transform: scale(0.9) rotate(5deg); }
      70%  { transform: scale(1.15) rotate(-3deg); }
      100% { transform: scale(1) rotate(0); }
    }

    /* Prize Wheel */
    #wheel-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      flex-direction: column;
    }

    #wheel-container {
      position: relative;
      width: 340px;
      height: 340px;
    }

    #wheel {
      width: 340px;
      height: 340px;
      border-radius: 50%;
      border: 10px solid #000;          /* ← black outline */
      position: relative;
      overflow: hidden;
      transition: transform 4.5s cubic-bezier(0.15, 0.8, 0.3, 1);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      background: #222; /* fallback */
    }

    .wheel-label {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 140px;
      transform-origin: 0 0;
      font-size: 13px;
      font-weight: 700;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }

    #wheel-pointer {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 32px solid #000;
      z-index: 10;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.5));
    }

    #prize-text {
      margin-top: 28px;
      font-size: 1.6rem;
      font-weight: 700;
      color: white;
      text-align: center;
      min-height: 40px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    #close-wheel {
      margin-top: 22px;
      background: white;
      color: #111;
      border: none;
      padding: 11px 28px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      transition: transform 0.2s;
    }

    #close-wheel:hover {
      transform: scale(1.05);
    }

    @media (max-width: 700px) {
      h1 { font-size: 2.5rem; }
      #floating-cat { width: 70px; }
      #wheel-container, #wheel {
        width: 280px;
        height: 280px;
      }
      .wheel-label {
        width: 115px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <img id="floating-cat" src="TinkyAdmire.png" alt="Tinky" draggable="false">

  <!-- Prize Wheel -->
  <div id="wheel-overlay">
    <div id="wheel-container">
      <div id="wheel-pointer"></div>
      <div id="wheel"></div>
    </div>
    <div id="prize-text"></div>
    <button id="close-wheel">Close</button>
  </div>

  <div class="container">
    <header>
      <h1>Tinky</h1>
      <p class="tagline">Solo Indie Game Developer</p>
      <p class="intro">
        I started making games for me and my friends many years ago.<br>
        Now I’m here to show them to the world. :D
      </p>
      <a class="steam-link" href="https://store.steampowered.com/developer/tinky" target="_blank">
        View on Steam →
      </a>
    </header>

    <section>
      <h2>My Games</h2>
      <div class="games">
        <div class="game-widget">
          <iframe src="https://store.steampowered.com/widget/4743000/" frameborder="0"></iframe>
        </div>
        <div class="game-widget">
          <iframe src="https://store.steampowered.com/widget/2699240/" frameborder="0"></iframe>
        </div>
        <div class="game-widget">
          <iframe src="https://store.steampowered.com/widget/2288310/" frameborder="0"></iframe>
        </div>
      </div>
    </section>

    <section class="socials-section">
      <h2>Find and join me here</h2>
      <div class="socials">
        <a href="https://discord.gg/27PsDbaDd6" target="_blank">Discord</a>
        <a href="https://www.patreon.com/c/Tinkyowo" target="_blank">Patreon</a>
        <a href="https://x.com/TinkySFW" target="_blank">Twitter</a>
        <a href="#" onclick="checkAge(event)">Twitter (NSFW)</a>
      </div>
    </section>

    <footer>
      Made by Tinky.
      <a href="https://store.steampowered.com/developer/tinky" target="_blank">Steam Developer Page</a>
    </footer>
  </div>

  <script>
    function checkAge(e) {
      e.preventDefault();
      const isAdult = confirm("This link leads to my NSFW Twitter.\n\nAre you 18 years or older?");
      if (isAdult) window.open("https://x.com/TinkyNSFW", "_blank");
    }

    // ===== Color Prizes =====
    const prizes = [
      { name: "Hot Pink",     color: "#ff4d6d", light: "#ff6b8a", dark: "#ff2a5f" },
      { name: "Sky Blue",     color: "#3b82f6", light: "#60a5fa", dark: "#2563eb" },
      { name: "Emerald",      color: "#10b981", light: "#34d399", dark: "#059669" },
      { name: "Purple Guy",   color: "#a855f7", light: "#c084fc", dark: "#9333ea" },
      { name: "Oi Orange",    color: "#f97316", light: "#fb923c", dark: "#ea580c" },
      { name: "Cya Cyan",     color: "#06b6d4", light: "#22d3ee", dark: "#0891b2" },
      { name: "Rose Roses",   color: "#f43f5e", light: "#fb7185", dark: "#e11d48" },
      { name: "Slimey Lime",  color: "#84cc16", light: "#a3e635", dark: "#65a30d" }
    ];

    const wheel = document.getElementById('wheel');
    const overlay = document.getElementById('wheel-overlay');
    const prizeText = document.getElementById('prize-text');
    const closeBtn = document.getElementById('close-wheel');

    // Build the wheel with conic-gradient + clean labels
    function buildWheel() {
      const segmentAngle = 360 / prizes.length;
      let gradientParts = [];

      prizes.forEach((prize, i) => {
        const start = i * segmentAngle;
        const end = (i + 1) * segmentAngle;
        gradientParts.push(`${prize.color} ${start}deg ${end}deg`);
      });

      wheel.style.background = `conic-gradient(from -${segmentAngle/2}deg, ${gradientParts.join(', ')})`;

      // Clear old labels
      wheel.querySelectorAll('.wheel-label').forEach(el => el.remove());

      // Add readable labels
      prizes.forEach((prize, i) => {
        const label = document.createElement('div');
        label.className = 'wheel-label';
        label.textContent = prize.name;

        // Position the label in the middle of its segment
        const midAngle = i * segmentAngle + segmentAngle / 2;
        // Rotate so text sits nicely along the radius
        label.style.transform = `
          rotate(${midAngle}deg)
          translate(95px)
          rotate(-90deg)
        `;

        wheel.appendChild(label);
      });
    }

    buildWheel();

    let isSpinning = false;

    function applyTheme(prize) {
      document.documentElement.style.setProperty('--accent', prize.color);
      document.documentElement.style.setProperty('--accent-light', prize.light);
      document.documentElement.style.setProperty('--accent-dark', prize.dark);

      // Soft background tint that matches the prize (still dark & elegant)
      const tint = `color-mix(in srgb, ${prize.color} 18%, #0d0d0d)`;
      document.documentElement.style.setProperty('--bg-tint', tint);
    }

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;

      overlay.style.display = 'flex';
      prizeText.textContent = "Spinning...";
      prizeText.style.color = "white";
      closeBtn.style.display = 'none';

      const extraSpins = 6 + Math.random() * 3;
      const randomDegree = Math.random() * 360;
      const totalDegree = extraSpins * 360 + randomDegree;

      // Reset then spin
      wheel.style.transition = 'none';
      wheel.style.transform = 'rotate(0deg)';
      void wheel.offsetWidth; // force reflow

      wheel.style.transition = 'transform 4.5s cubic-bezier(0.15, 0.8, 0.3, 1)';
      wheel.style.transform = `rotate(${totalDegree}deg)`;

      setTimeout(() => {
        const actual = totalDegree % 360;
        const segmentAngle = 360 / prizes.length;

        // Because we offset the gradient by -half segment, adjust the index calculation
        const adjusted = (actual + segmentAngle / 2) % 360;
        const index = Math.floor(((360 - adjusted) % 360) / segmentAngle) % prizes.length;

        const won = prizes[index];
        prizeText.textContent = "Theme unlocked: " + won.name;
        prizeText.style.color = won.color;
        closeBtn.style.display = 'inline-block';

        applyTheme(won);
        isSpinning = false;
      }, 4700);
    }

    closeBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      bouncing = false;
    });

    // ===== Floating Cat =====
    const cat = document.getElementById('floating-cat');
    let x = 100, y = 100, dx = 2.8, dy = 2.2;
    let bouncing = false;

    function moveCat() {
      if (!bouncing) {
        const maxX = window.innerWidth - cat.offsetWidth;
        const maxY = window.innerHeight - cat.offsetHeight;
        x += dx;
        y += dy;
        if (x <= 0 || x >= maxX) dx = -dx;
        if (y <= 0 || y >= maxY) dy = -dy;
        x = Math.max(0, Math.min(x, maxX));
        y = Math.max(0, Math.min(y, maxY));
        cat.style.left = x + 'px';
        cat.style.top = y + 'px';
      }
      requestAnimationFrame(moveCat);
    }

    cat.addEventListener('click', () => {
      if (bouncing || isSpinning) return;
      bouncing = true;
      cat.classList.add('bounce');
      setTimeout(() => {
        cat.classList.remove('bounce');
        spinWheel();
      }, 500);
    });

    window.addEventListener('load', () => {
      x = Math.random() * (window.innerWidth - 100);
      y = Math.random() * (window.innerHeight - 100);
      moveCat();
    });

    window.addEventListener('resize', () => {
      x = Math.min(x, window.innerWidth - cat.offsetWidth);
      y = Math.min(y, window.innerHeight - cat.offsetHeight);
    });
  </script>
</body>
</html>
