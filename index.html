<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tinky - Indie Game Developer</title>

  <!-- Discord / Open Graph Embed -->
  <meta property="og:title" content="Tinky - Indie Game Developer">
  <meta property="og:description" content="Solo indie game developer. Come check out my games!">
  <meta property="og:image" content="https://tinkyowo.github.io/Tinkys-Website/TinkyNewStyleTransparent.png">
  <meta property="og:url" content="https://tinkyowo.github.io/Tinkys-Website/">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#ff4d6d">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tinky - Indie Game Developer">
  <meta name="twitter:description" content="Solo indie game developer. Come check out my games!">
  <meta name="twitter:image" content="https://tinkyowo.github.io/Tinkys-Website/TinkyNewStyleTransparent.png">

  <style>
    :root {
      --accent: #ff4d6d;
      --accent-light: #ff6b8a;
      --accent-dark: #ff2a5f;
      --bg-tint: #0d0d0d;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(to bottom, var(--bg-tint), #000000);
      color: #f0f0f0;
      line-height: 1.6;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
      transition: background 0.8s ease;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    header {
      text-align: center;
      margin-bottom: 3.5rem;
      padding-top: 1.5rem;
    }
    .header-cat {
      width: 140px;
      height: auto;
      margin-bottom: 0.8rem;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
      cursor: pointer;
      transition: transform 0.2s ease;
      user-select: none;
    }
    .header-cat:hover {
      transform: scale(1.08);
    }
    .header-cat:active {
      transform: scale(0.95);
    }
    h1 {
      font-size: 3.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, var(--accent-light), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: all 0.6s ease;
    }
    .tagline {
      font-size: 1.25rem;
      color: #b0b0b0;
      margin-bottom: 1.4rem;
    }
    .intro {
      max-width: 520px;
      margin: 0 auto 2rem;
      color: #cfcfcf;
      font-size: 1.05rem;
    }
    .steam-link {
      display: inline-block;
      background: linear-gradient(90deg, var(--accent), var(--accent-dark));
      color: white;
      text-decoration: none;
      padding: 0.7rem 1.6rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    .steam-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    h2 {
      font-size: 1.5rem;
      margin-bottom: 1.8rem;
      color: var(--accent-light);
      text-align: center;
      transition: color 0.6s ease;
    }
    .games {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      align-items: center;
      margin-bottom: 4.5rem;
    }
    .game-widget {
      width: 100%;
      max-width: 646px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .game-widget iframe {
      width: 100%;
      height: 190px;
      border: none;
      display: block;
    }
    .socials-section {
      text-align: center;
      margin-bottom: 3rem;
    }
    .socials {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.9rem;
    }
    .socials a {
      color: var(--accent-light);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.5rem 1.1rem;
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      border-radius: 30px;
      transition: all 0.3s ease;
    }
    .socials a:hover {
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      border-color: var(--accent);
      color: var(--accent-light);
    }
    footer {
      text-align: center;
      margin-top: 2rem;
      padding-bottom: 2rem;
      color: #777;
      font-size: 0.9rem;
    }
    footer a {
      color: var(--accent-light);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    /* Floating cats */
    .floating-cat {
      position: fixed;
      width: 90px;
      height: auto;
      z-index: 9999;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }
    .floating-cat.bounce {
      animation: bounce 0.5s ease;
    }
    .floating-cat.crazy {
      animation: crazySpin 0.4s linear infinite;
    }
    @keyframes bounce {
      0% { transform: scale(1); }
      30% { transform: scale(1.35) rotate(-8deg); }
      50% { transform: scale(0.9) rotate(5deg); }
      70% { transform: scale(1.15) rotate(-3deg); }
      100% { transform: scale(1) rotate(0); }
    }
    @keyframes crazySpin {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(90deg) scale(1.2); }
      50% { transform: rotate(180deg) scale(0.9); }
      75% { transform: rotate(270deg) scale(1.15); }
      100% { transform: rotate(360deg) scale(1); }
    }

    /* Spawn controls */
    #spawn-controls {
      position: fixed;
      bottom: 18px;
      left: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 10001;
    }
    #cat-counter {
      font-size: 12px;
      font-weight: 600;
      color: #888;
      background: rgba(0, 0, 0, 0.5);
      padding: 2px 7px;
      border-radius: 10px;
      user-select: none;
    }
    #spawn-dot {
      width: 11px;
      height: 11px;
      background: #333;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.45;
      transition: all 0.25s ease;
    }
    #spawn-dot:hover {
      opacity: 0.9;
      background: var(--accent);
      transform: scale(1.4);
    }

    @media (max-width: 700px) {
      h1 { font-size: 2.5rem; }
      .header-cat { width: 110px; }
      .floating-cat { width: 70px; }
    }
  </style>
</head>
<body>
  <div id="spawn-controls">
    <div id="cat-counter">1</div>
    <div id="spawn-dot" title="Spawn another cat"></div>
  </div>

  <div class="container">
    <header>
      <img src="TinkyNewStyleTransparent.png" alt="Tinky" class="header-cat" id="header-cat">
      <h1>Tinky</h1>
      <p class="tagline">Solo Indie Game Developer</p>
      <p class="intro">
        I started making games for me and my friends many years ago.<br>
        Now I’m here to show them to the world. :D
      </p>
      <a class="steam-link" href="https://store.steampowered.com/developer/tinky" target="_blank">
        View on Steam →
      </a>
    </header>

    <section>
      <h2>My Games</h2>
      <div class="games">
        <div class="game-widget">
          <iframe src="https://store.steampowered.com/widget/4743000/" frameborder="0"></iframe>
        </div>
        <div class="game-widget">
          <iframe src="https://store.steampowered.com/widget/2699240/" frameborder="0"></iframe>
        </div>
        <div class="game-widget">
          <iframe src="https://store.steampowered.com/widget/2288310/" frameborder="0"></iframe>
        </div>
      </div>
    </section>

    <section class="socials-section">
      <h2>Find and join me here</h2>
      <div class="socials">
        <a href="https://discord.gg/27PsDbaDd6" target="_blank">Discord</a>
        <a href="https://www.patreon.com/c/Tinkyowo" target="_blank">Patreon</a>
        <a href="https://x.com/TinkySFW" target="_blank">Twitter</a>
        <a href="#" onclick="checkAge(event)">Twitter (NSFW)</a>
      </div>
    </section>

    <footer>
      Made by Tinky.
      <a href="https://store.steampowered.com/developer/tinky" target="_blank">Steam Developer Page</a>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <script>
    function checkAge(e) {
      e.preventDefault();
      const isAdult = confirm("This link leads to my NSFW Twitter.\n\nAre you 18 years or older?");
      if (isAdult) window.open("https://x.com/TinkyNSFW", "_blank");
    }

    // ===== Color Themes =====
    const prizes = [
      { name: "Sky Blue",     color: "#3b82f6", light: "#60a5fa", dark: "#2563eb" },
      { name: "Purple Guy",   color: "#a855f7", light: "#c084fc", dark: "#9333ea" },
      { name: "Oi Orange",    color: "#f97316", light: "#fb923c", dark: "#ea580c" },
      { name: "Cya Cyan",     color: "#06b6d4", light: "#22d3ee", dark: "#0891b2" },
      { name: "Rose Roses",   color: "#f43f5e", light: "#fb7185", dark: "#e11d48" },
      { name: "Slimey Lime",  color: "#84cc16", light: "#a3e635", dark: "#65a30d" }
    ];

    let currentIndex = 0;

    function applyTheme(prize) {
      document.documentElement.style.setProperty('--accent', prize.color);
      document.documentElement.style.setProperty('--accent-light', prize.light);
      document.documentElement.style.setProperty('--accent-dark', prize.dark);
      const tint = `color-mix(in srgb, ${prize.color} 18%, #0d0d0d)`;
      document.documentElement.style.setProperty('--bg-tint', tint);
      localStorage.setItem('tinky-theme', JSON.stringify(prize));
    }

    function loadSavedTheme() {
      const saved = localStorage.getItem('tinky-theme');
      if (saved) {
        try {
          const prize = JSON.parse(saved);
          applyTheme(prize);
          const idx = prizes.findIndex(p => p.color === prize.color);
          if (idx !== -1) currentIndex = idx;
        } catch (e) {}
      }
    }
    loadSavedTheme();

    function fireConfetti(color) {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
        colors: [color, '#ffffff', '#f0f0f0']
      });
      setTimeout(() => {
        confetti({
          particleCount: 50,
          angle: 60,
          spread: 50,
          origin: { x: 0 },
          colors: [color, '#ffffff']
        });
        confetti({
          particleCount: 50,
          angle: 120,
          spread: 50,
          origin: { x: 1 },
          colors: [color, '#ffffff']
        });
      }, 150);
    }

    function nextColor() {
      currentIndex = (currentIndex + 1) % prizes.length;
      const prize = prizes[currentIndex];
      applyTheme(prize);
      fireConfetti(prize.color);
    }

    // ===== Bounce Sound =====
    let audioCtx = null;

    function playBounceSound() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(280, audioCtx.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.12);
      gainNode.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      oscillator.start(audioCtx.currentTime);
      oscillator.stop(audioCtx.currentTime + 0.15);
    }

    // ===== Multiple Cats =====
    const cats = [];
    const counterEl = document.getElementById('cat-counter');
    let isCrazy = false;

    function updateCounter() {
      counterEl.textContent = cats.length;
    }

    function createCat() {
      const cat = document.createElement('img');
      cat.src = 'TinkyAdmire.png';
      cat.alt = 'Tinky';
      cat.draggable = false;
      cat.className = 'floating-cat';

      const startX = Math.random() * (window.innerWidth - 100);
      const startY = Math.random() * (window.innerHeight - 100);

      const catData = {
        el: cat,
        x: startX,
        y: startY,
        dx: (Math.random() * 1.8 + 1.8) * (Math.random() < 0.5 ? 1 : -1),
        dy: (Math.random() * 1.5 + 1.5) * (Math.random() < 0.5 ? 1 : -1),
        bouncing: false,
        normalDx: 0,
        normalDy: 0
      };

      cat.style.left = catData.x + 'px';
      cat.style.top = catData.y + 'px';

      cat.addEventListener('click', () => {
        if (catData.bouncing) return;
        nextColor();
        catData.bouncing = true;
        cat.classList.add('bounce');
        setTimeout(() => {
          cat.classList.remove('bounce');
          catData.bouncing = false;
        }, 500);
      });

      document.body.appendChild(cat);
      cats.push(catData);
      updateCounter();
    }

    createCat();

    function moveCats() {
      cats.forEach(cat => {
        if (cat.bouncing) return;

        const maxX = window.innerWidth - cat.el.offsetWidth;
        const maxY = window.innerHeight - cat.el.offsetHeight;

        // Speed up a lot when crazy
        const speedMultiplier = isCrazy ? 3.2 : 1;

        cat.x += cat.dx * speedMultiplier;
        cat.y += cat.dy * speedMultiplier;

        let bounced = false;

        if (cat.x <= 0 || cat.x >= maxX) {
          cat.dx = -cat.dx;
          bounced = true;
        }
        if (cat.y <= 0 || cat.y >= maxY) {
          cat.dy = -cat.dy;
          bounced = true;
        }

        if (bounced && !isCrazy) {
          playBounceSound();
        }

        cat.x = Math.max(0, Math.min(cat.x, maxX));
        cat.y = Math.max(0, Math.min(cat.y, maxY));

        cat.el.style.left = cat.x + 'px';
        cat.el.style.top = cat.y + 'px';
      });
      requestAnimationFrame(moveCats);
    }
    moveCats();

    // ===== Go Crazy Mode =====
    document.getElementById('header-cat').addEventListener('click', () => {
      if (isCrazy) return;

      isCrazy = true;

      // Make all cats spin wildly
      cats.forEach(cat => {
        cat.el.classList.add('crazy');
      });

      // Stop the madness after 3.5 seconds
      setTimeout(() => {
        isCrazy = false;
        cats.forEach(cat => {
          cat.el.classList.remove('crazy');
        });
      }, 3500);
    });

    document.getElementById('spawn-dot').addEventListener('click', createCat);

    window.addEventListener('resize', () => {
      cats.forEach(cat => {
        cat.x = Math.min(cat.x, window.innerWidth - cat.el.offsetWidth);
        cat.y = Math.min(cat.y, window.innerHeight - cat.el.offsetHeight);
      });
    });
  </script>
</body>
</html>
