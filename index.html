<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tinky's Base</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #fff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1.25rem;
      color: #a1a1aa;
      max-width: 500px;
      margin-bottom: 2rem;
    }
    .links a {
      display: inline-block;
      margin: 0 0.75rem;
      color: #c4b5fd;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .links a:hover { color: #fff; }
  </style>
</head>
<body>
  <h1>Your Name</h1>
  <p>Developer • Artist • Chill Guy</p>
  <div class="links">
    <a href="#">About</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
  </div>
</body>
</html>
