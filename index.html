<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tinky - Indie Game Developer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(to bottom, #0d0d0d, #000000);
  color: #f0f0f0;
  line-height: 1.6;
  min-height: 100vh;
  padding: 2rem 1.5rem;
  overflow-x: hidden;
}

    .container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
      padding-top: 1.5rem;
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #ff6b8a, #ff3d6e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 1.25rem;
      color: #b0b0b0;
      margin-bottom: 1.4rem;
    }

    .intro {
      max-width: 520px;
      margin: 0 auto 2rem;
      color: #cfcfcf;
      font-size: 1.05rem;
    }

    .steam-link {
      display: inline-block;
      background: linear-gradient(90deg, #ff4d6d, #ff2a5f);
      color: white;
      text-decoration: none;
      padding: 0.7rem 1.6rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .steam-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 61, 110, 0.35);
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1.8rem;
      color: #ff6b8a;
      text-align: center;
    }

    .games {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      align-items: center;
      margin-bottom: 4.5rem;
    }

    .game-widget {
      width: 100%;
      max-width: 646px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .game-widget iframe {
      width: 100%;
      height: 190px;
      border: none;
      display: block;
    }

    .socials-section {
      text-align: center;
      margin-bottom: 3rem;
    }

    .socials {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.9rem;
    }

    .socials a {
      color: #ff6b8a;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.5rem 1.1rem;
      border: 1px solid #ff4d6d55;
      border-radius: 30px;
      transition: all 0.2s;
    }

    .socials a:hover {
      background: #ff4d6d22;
      border-color: #ff4d6d;
      color: #ff8fa3;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      padding-bottom: 2rem;
      color: #777;
      font-size: 0.9rem;
    }

    footer a {
      color: #ff6b8a;
      text-decoration: none;
    }

    /* Floating cat */
    #floating-cat {
      position: fixed;
      width: 90px;
      height: auto;
      z-index: 9999;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    #floating-cat.bounce {
      animation: bounce 0.5s ease;
    }

    @keyframes bounce {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.35) rotate(-8deg); }
      50%  { transform: scale(0.9) rotate(5deg); }
      70%  { transform: scale(1.15) rotate(-3deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 2.5rem;
      }
      #floating-cat {
        width: 70px;
      }
    }
  </style>
</head>
<body>

  <!-- Floating cat (upload TinkyAdmire.png to your repo) -->
  <img id="floating-cat" src="TinkyAdmire.png" alt="Tinky" draggable="false">

  <div class="container">
    <header>
      <h1>Tinky</h1>
      <p class="tagline">Solo Indie Game Developer</p>
      <p class="intro">
        I started making games for me and my friends many years ago.<br>
        Now I’m here to show them to the world. :D
      </p>
      <a class="steam-link" href="https://store.steampowered.com/developer/tinky" target="_blank">
        View on Steam →
      </a>
    </header>

    <section>
      <h2>My Games</h2>
      <div class="games">
        <div class="game-widget">
          <iframe src="https://store.steampowered.com/widget/4743000/" frameborder="0"></iframe>
        </div>
        <div class="game-widget">
          <iframe src="https://store.steampowered.com/widget/2699240/" frameborder="0"></iframe>
        </div>
        <div class="game-widget">
          <iframe src="https://store.steampowered.com/widget/2288310/" frameborder="0"></iframe>
        </div>
      </div>
    </section>

    <section class="socials-section">
      <h2>Find and join me here</h2>
      <div class="socials">
        <a href="https://discord.gg/27PsDbaDd6" target="_blank">Discord</a>
        <a href="https://www.patreon.com/c/Tinkyowo" target="_blank">Patreon</a>
        <a href="https://x.com/TinkySFW" target="_blank">Twitter</a>
        <a href="#" onclick="checkAge(event)">Twitter (NSFW)</a>
      </div>
    </section>

    <footer>
      Made by Tinky.
      <a href="https://store.steampowered.com/developer/tinky" target="_blank">Steam Developer Page</a>
    </footer>
  </div>

  <script>
    // Age check for NSFW
    function checkAge(e) {
      e.preventDefault();
      const isAdult = confirm("This link leads to my NSFW Twitter.\n\nAre you 18 years or older?");
      if (isAdult) {
        window.open("https://x.com/TinkyNSFW", "_blank");
      }
    }

// Floating cat logic
const cat = document.getElementById('floating-cat');
let x = 100;
let y = 100;
let dx = 2.8;   // speed X
let dy = 2.2;   // speed Y
let bouncing = false;

function moveCat() {
  if (bouncing) return;

  const maxX = window.innerWidth - cat.offsetWidth;
  const maxY = window.innerHeight - cat.offsetHeight;

  x += dx;
  y += dy;

  // Bounce off walls
  if (x <= 0 || x >= maxX) dx = -dx;
  if (y <= 0 || y >= maxY) dy = -dy;

  // Keep inside screen
  x = Math.max(0, Math.min(x, maxX));
  y = Math.max(0, Math.min(y, maxY));

  cat.style.left = x + 'px';
  cat.style.top = y + 'px';

  requestAnimationFrame(moveCat);
}

// Click → bounce + pause for a few seconds
cat.addEventListener('click', () => {
  if (bouncing) return;

  bouncing = true;
  cat.classList.add('bounce');

  // Remove bounce animation after 0.5s
  setTimeout(() => {
    cat.classList.remove('bounce');
  }, 500);

  // Wait 2 seconds total before he starts moving again
  setTimeout(() => {
    bouncing = false;
  }, 2000); // ← change this number to make the pause longer or shorter (in milliseconds)
});

// Start moving
window.addEventListener('load', () => {
  x = Math.random() * (window.innerWidth - 100);
  y = Math.random() * (window.innerHeight - 100);
  moveCat();
});

// Handle window resize
window.addEventListener('resize', () => {
  const maxX = window.innerWidth - cat.offsetWidth;
  const maxY = window.innerHeight - cat.offsetHeight;
  x = Math.min(x, maxX);
  y = Math.min(y, maxY);
});
  </script>
</body>
</html>
