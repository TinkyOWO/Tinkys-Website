<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tinky - Indie Game Developer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #121212;
      color: #f0f0f0;
      line-height: 1.6;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
      padding-top: 1.5rem;
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #ff6b8a, #ff3d6e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 1.25rem;
      color: #b0b0b0;
      margin-bottom: 1.4rem;
    }

    .intro {
      max-width: 520px;
      margin: 0 auto 2rem;
      color: #cfcfcf;
      font-size: 1.05rem;
    }

    .steam-link {
      display: inline-block;
      background: linear-gradient(90deg, #ff4d6d, #ff2a5f);
      color: white;
      text-decoration: none;
      padding: 0.7rem 1.6rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 1.8rem;
    }

    .steam-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 61, 110, 0.35);
    }

    .socials {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.9rem;
      margin-top: 1.8rem;
    }

    .socials a {
      color: #ff6b8a;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid #ff4d6d55;
      border-radius: 30px;
      transition: all 0.2s;
    }

    .socials a:hover {
      background: #ff4d6d22;
      border-color: #ff4d6d;
      color: #ff8fa3;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1.8rem;
      color: #ff6b8a;
      text-align: center;
    }

    .games {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      align-items: center;
    }

    .game-widget {
      width: 100%;
      max-width: 646px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .game-widget iframe {
      width: 100%;
      height: 190px;
      border: none;
      display: block;
    }

    footer {
      text-align: center;
      margin-top: 4.5rem;
      padding-bottom: 2rem;
      color: #777;
      font-size: 0.9rem;
    }

    footer a {
      color: #ff6b8a;
      text-decoration: none;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Tinky</h1>
      <p class="tagline">Solo Indie Game Developer</p>
      <p class="intro">
        I started making games for me and my friends many years ago.<br>
        Now I’m here to show them to the world. :D
      </p>
      <a class="steam-link" href="https://store.steampowered.com/developer/tinky" target="_blank">
        View on Steam →
      </a>

      <div class="socials">
        <a href="https://discord.gg/27PsDbaDd6" target="_blank">Discord</a>
        <a href="https://www.patreon.com/c/Tinkyowo" target="_blank">Patreon</a>
        <a href="https://x.com/TinkySFW" target="_blank">Twitter</a>
        <a href="#" onclick="checkAge(event)">Sussy Twitter</a>
      </div>
    </header>

    <section>
      <h2>My Games</h2>
      <div class="games">

        <!-- Critter Climb -->
        <div class="game-widget">
          <iframe src="https://store.steampowered.com/widget/4743000/" frameborder="0"></iframe>
        </div>

        <!-- Zomcats Invasion -->
        <div class="game-widget">
          <iframe src="https://store.steampowered.com/widget/2699240/" frameborder="0"></iframe>
        </div>

        <!-- Five Nights at Tinky's -->
        <div class="game-widget">
          <iframe src="https://store.steampowered.com/widget/2288310/" frameborder="0"></iframe>
        </div>

      </div>
    </section>

    <footer>
      Made by Tinky · 
      <a href="https://store.steampowered.com/developer/tinky" target="_blank">Steam Developer Page</a>
    </footer>
  </div>

  <script>
    function checkAge(e) {
      e.preventDefault();
      const isAdult = confirm("This link leads to my NSFW Twitter.\n\nAre you 18 years or older?");
      if (isAdult) {
        window.open("https://x.com/TinkyNSFW", "_blank");
      }
    }
  </script>
</body>
</html>
